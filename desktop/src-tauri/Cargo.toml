[package]
name = "bulka-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri-оболочка Bulka: поднимает Node-сервер Astro на 127.0.0.1:<порт> и открывает окно"

[lib]
name = "bulka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
