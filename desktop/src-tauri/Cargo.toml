[package]
name = "bulka-desktop"
version = "0.3.0"
edition = "2021"
description = "Tauri-оболочка Bulka: поднимает Node-сервер Astro на 127.0.0.1:<порт> и открывает окно"

[lib]
name = "bulka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Node-сервер поднимаем через shell-плагин: Tauri сам трекает дочерний процесс и убивает его
# при выходе приложения (kill children on App drop) — без осиротевших node.exe. Это штатный путь.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# только machine::id — номер компьютера, общий со студиями
studio-hub-client = { git = "https://github.com/timoncool/studio-hub-client", rev = "68d95f8699ebc5dc919a842c4a5d55802c9ceb1b" }

[profile.release]
opt-level = "s"
lto = true
strip = true
