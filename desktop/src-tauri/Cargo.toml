[package]
name = "bulka-desktop"
version = "0.4.0"
edition = "2021"
description = "Tauri-оболочка Bulka: поднимает Node-сервер Astro на 127.0.0.1:<порт> и открывает окно"

[lib]
name = "bulka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Node-сервер поднимаем через shell-плагин: Tauri сам трекает дочерний процесс и убивает его
# при выходе приложения (kill children on App drop) — без осиротевших node.exe. Это штатный путь.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# только machine::id — номер компьютера, общий со студиями
studio-hub-client = { git = "https://github.com/timoncool/studio-hub-client", rev = "365c2b757bfddd45fff67e7264b41f4f961a0032" }

# WebView2 Runtime для портатива (src/webview2.rs): проверка в реестре и загрузка установщика Microsoft.
# reqwest и rustls — те же, что уже приносит tauri-plugin-updater.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
