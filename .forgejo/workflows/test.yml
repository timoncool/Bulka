name: Strudel tests

on: [push, pull_request]

jobs:
  build:
    runs-on: docker
    container: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm run format-check
      - run: pnpm run lint
      - run: pnpm test
